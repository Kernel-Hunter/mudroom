name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # The app targets macOS 26 and needs the Xcode 26 toolchain (Swift 6.2+).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    # MudroomCore and the CLI only; the SwiftUI app isn't part of the
    # package on Linux.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
