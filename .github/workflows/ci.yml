name: CI

on:
  push:
    branches: [main, windows-support]
  pull_request:

jobs:
  macos:
    # The app targets macOS 26 and needs the Xcode 26 toolchain (Swift 6.2+).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    # MudroomCore and the CLI only; the SwiftUI app isn't part of the
    # package on Linux.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  windows:
    # MudroomCore and the CLI only, as on Linux. GitHub's Windows runners
    # can't run Linux containers, so nothing here needs Docker.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE
          build_arch: ${{ matrix.arch }}
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      # Swift 6.2 ships Clang 19; the runner's Visual Studio 2026 C++ headers
      # (used by swift-crypto's BoringSSL) ask for Clang 20 unless told not to.
      - name: Build
        run: swift build -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      - name: Test
        run: swift test -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
