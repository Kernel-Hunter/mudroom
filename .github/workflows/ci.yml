name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # The app targets macOS 26 and needs the Xcode 26 toolchain (Swift 6.2+).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    # MudroomCore and the CLI only; the SwiftUI app isn't part of the
    # package on Linux.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  windows:
    # MudroomCore and the CLI only, as on Linux. Nothing here needs a
    # container runtime; windows-sandbox below runs a real one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.4-release
          swift-build: 6.2.4-RELEASE
          build_arch: ${{ matrix.arch }}
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      # Swift 6.2 ships Clang 19; the runner's Visual Studio 2026 C++ headers
      # (used by swift-crypto's BoringSSL) ask for Clang 20 unless told not to.
      - name: Build
        run: swift build -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      - name: Test
        run: swift test -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      # A session end to end without a sandbox: clone, edit work/, diff,
      # apply, undo, discard.
      - name: CLI smoke test
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/windows-smoke.ps1 .build/debug/mudroom.exe

  windows-zip:
    # The release zip for x86_64 and arm64, then each one run on a fresh
    # runner without Swift: --version, --help and the smoke test.
    uses: ./.github/workflows/windows-zip.yml

  windows-sandbox:
    # A real sandbox on Windows: windows-latest (Windows Server 2025 on AMD)
    # has nested virtualization, so WSL 2 and a Podman machine run there.
    # The arm64 runner doesn't (no virtualization extensions; WSL can't be
    # installed and a Hyper-V VM won't start), so x86_64 only. Uses the
    # release zip, so no Swift on this runner either.
    needs: windows-zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mudroom-windows-x86_64
          path: dist
      - name: Unzip
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist/*.zip).FullName $env:RUNNER_TEMP
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\mudroom-*\mudroom.exe").FullName
          "MUDROOM_EXE=$exe" >> $env:GITHUB_ENV
      - name: Podman machine
        shell: pwsh
        env:
          PODMAN_VERSION: v6.1.3
        run: |
          wsl --update --web-download
          $zip = "$env:RUNNER_TEMP\podman.zip"
          Invoke-WebRequest "https://github.com/containers/podman/releases/download/$env:PODMAN_VERSION/podman-remote-release-windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\podman"
          $bin = Split-Path (Get-ChildItem "$env:RUNNER_TEMP\podman" -Recurse -Filter podman.exe | Select-Object -First 1).FullName
          $bin >> $env:GITHUB_PATH
          $podman = "$bin\podman.exe"
          & $podman machine init --now
          if ($LASTEXITCODE -ne 0) { throw "podman machine init failed" }
          # The machine's rootless user has no pids cgroup controller on this
          # runner, and Podman's default pids limit needs one ("controller
          # `pids` is not available"). Turn the default limit off.
          & $podman machine ssh "mkdir -p ~/.config/containers && printf '[containers]\npids_limit = 0\n' > ~/.config/containers/containers.conf"
          if ($LASTEXITCODE -ne 0) { throw "podman machine ssh failed" }
          & $podman machine stop
          & $podman machine start
          if ($LASTEXITCODE -ne 0) { throw "podman machine start failed" }
          & $podman version
      - name: Sandbox session (podman, open network)
        timeout-minutes: 15
        shell: pwsh
        run: scripts/windows-sandbox-check.ps1 $env:MUDROOM_EXE podman -Network open
      # Locked mode: the Podman machine reaches the proxy on the WSL network's
      # gateway, which Windows Firewall blocks until a rule allows it. Without
      # the rule the check has to stop quickly and say which rule to add.
      - name: Locked network check without a firewall rule
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = & $env:MUDROOM_EXE network check --backend podman --mode locked 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw "the locked check passed without a firewall rule" }
          if ($out -notmatch 'New-NetFirewallRule') { throw "no firewall hint in the error" }
          # The failure above is the expected result; without this the
          # runner's pwsh wrapper exits with mudroom's status.
          exit 0
      - name: Allow Mudroom's proxy through Windows Firewall
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName 'Mudroom proxy' -Direction Inbound -Action Allow -Protocol TCP -Program $env:MUDROOM_EXE | Out-Null
          # Log dropped packets, so a failure below names the filter.
          auditpol /set /subcategory:"Filtering Platform Packet Drop" /failure:enable
          auditpol /set /subcategory:"Filtering Platform Connection" /failure:enable
      - name: Sandbox session (podman, locked network)
        timeout-minutes: 15
        shell: pwsh
        run: scripts/windows-sandbox-check.ps1 $env:MUDROOM_EXE podman -SkipImageBuild
      # What the firewall and WSL's network looked like when locked mode
      # failed, which filter dropped the connection, and whether a plain
      # listener on the WSL gateway is reachable.
      - name: Firewall and network state
        if: failure()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-NetFirewallRule -Direction Inbound | Where-Object { ($_ | Get-NetFirewallApplicationFilter).Program -like '*mudroom*' } |
            Format-Table DisplayName, Action, Enabled, Profile -AutoSize | Out-String -Width 200
          Get-NetFirewallRule -Direction Inbound -Action Block -Enabled True -ErrorAction SilentlyContinue | Format-Table DisplayName, Profile -AutoSize | Out-String -Width 200
          $rows = Get-WinEvent -FilterHashtable @{LogName='Security'; Id=5152,5157} -MaxEvents 500 -ErrorAction SilentlyContinue | ForEach-Object {
            $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }
            [pscustomobject]@{ Time = $_.TimeCreated.ToString('HH:mm:ss'); Id = $_.Id; App = $d.Application; Dir = $d.Direction
              Src = "$($d.SourceAddress):$($d.SourcePort)"; Dst = "$($d.DestAddress):$($d.DestPort)"; Filter = $d.FilterRTID; Layer = $d.LayerName }
          } | Where-Object { $_.Src -like '172.*' -or $_.Dst -like '172.*' }
          $rows | Select-Object -First 40 | Format-Table -AutoSize | Out-String -Width 300
          netsh wfp show filters file="$env:RUNNER_TEMP\filters.xml" | Out-Null
          $ids = @($rows.Filter | Sort-Object -Unique)
          ([xml](Get-Content "$env:RUNNER_TEMP\filters.xml")).SelectNodes('//filters/item') | Where-Object { $ids -contains $_.filterId } |
            ForEach-Object { "filter $($_.filterId): $($_.displayData.name) / $($_.displayData.description) / $($_.action.type)" }
          $routes = podman machine ssh "ip -4 route"
          $routes
          $gw = ([regex]'default via (\S+)').Match(($routes | Out-String)).Groups[1].Value
          New-NetFirewallRule -DisplayName 'diag listener' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 18080 | Out-Null
          $l = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Parse($gw), 18080); $l.Start()
          podman machine ssh "timeout 5 bash -c 'echo > /dev/tcp/$gw/18080' && echo 'machine to gateway: ok' || echo 'machine to gateway: failed'"
          $js = "for (const h of ['$gw', 'host.containers.internal']) { const s = require('net').connect({host: h, port: 18080}); const t = setTimeout(() => { console.log(h, 'timeout'); s.destroy(); }, 5000); s.on('connect', () => { clearTimeout(t); console.log(h, 'ok'); s.destroy(); }); s.on('error', e => { clearTimeout(t); console.log(h, e.code); }); }"
          podman run --rm --network podman mudroom/agent-base:latest cat /etc/hosts
          podman run --rm --network podman mudroom/agent-base:latest node -e $js
          $l.Stop()
          & $env:MUDROOM_EXE network check --backend podman --mode locked
          exit 0
