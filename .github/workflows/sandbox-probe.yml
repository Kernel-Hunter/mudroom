name: Sandbox probe

# Temporary: can a GitHub-hosted Windows runner run Linux containers?

on:
  pull_request:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Virtualization facts
        continue-on-error: true
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, HypervisorPresent
          Get-CimInstance Win32_Processor | Format-List Name, VirtualizationFirmwareEnabled, VMMonitorModeExtensions, SecondLevelAddressTranslationExtensions
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-WindowsOptionalFeature -Online | Where-Object FeatureName -match 'Hyper|VirtualMachine|Subsystem|Containers' | Format-Table FeatureName, State
          systeminfo | Select-String -Context 0,5 'Hyper-V'
          Get-Command docker, wsl, podman -ErrorAction SilentlyContinue | Format-Table Name, Source
          docker version
          docker info --format '{{.OSType}} {{.Architecture}}'

      - name: WSL status
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          wsl --version; "exit $LASTEXITCODE"
          wsl --status; "exit $LASTEXITCODE"
          wsl -l -v; "exit $LASTEXITCODE"

      - name: WSL2 install and run a distro
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          wsl --update --web-download; "update exit $LASTEXITCODE"
          wsl --set-default-version 2; "set-default-version exit $LASTEXITCODE"
          wsl --install -d Ubuntu-24.04 --web-download --no-launch; "install exit $LASTEXITCODE"
          wsl -l -v; "list exit $LASTEXITCODE"
          wsl -d Ubuntu-24.04 -u root -- uname -a; "run exit $LASTEXITCODE"
          wsl -l -v

      - name: WSL2 import a rootfs
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x86_64' }
          $base = "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/$arch"
          $file = [regex]::Match((Invoke-RestMethod "$base/latest-releases.yaml"), 'alpine-minirootfs-[\d.]+-\w+\.tar\.gz').Value
          Invoke-WebRequest "$base/$file" -OutFile "$env:RUNNER_TEMP\alpine.tar.gz"
          wsl --import alpine "$env:RUNNER_TEMP\alpine" "$env:RUNNER_TEMP\alpine.tar.gz" --version 2; "import v2 exit $LASTEXITCODE"
          wsl -d alpine -u root -- uname -a; "run v2 exit $LASTEXITCODE"
          wsl -l -v

      - name: Podman machine
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $tag = (Invoke-RestMethod https://api.github.com/repos/containers/podman/releases/latest).tag_name
          Invoke-WebRequest "https://github.com/containers/podman/releases/download/$tag/podman-remote-release-windows_$arch.zip" -OutFile "$env:RUNNER_TEMP\podman.zip"
          Expand-Archive "$env:RUNNER_TEMP\podman.zip" "$env:RUNNER_TEMP\podman"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\podman" -Recurse -Filter podman.exe | Select-Object -First 1).FullName
          & $exe --version
          & $exe machine init --now; "wsl provider exit $LASTEXITCODE"
          $env:CONTAINERS_MACHINE_PROVIDER = 'hyperv'
          & $exe machine init --now hv; "hyperv provider exit $LASTEXITCODE"
          & $exe machine ls
